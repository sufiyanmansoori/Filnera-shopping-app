<!doctype html>
<html lang="en">
  <head>
    <!-- Base href placeholder for Flutter build. Do not change this line - Flutter CLI replaces it during build. -->
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- SEO & Description -->
    <meta
      name="description"
      content="Filnera Shop - Your one-stop shop for premium electronics, fashion, and home essentials."
    />
    <meta
      name="keywords"
      content="ecommerce, shopping, filnera, electronics, fashion, deals"
    />
    <meta name="author" content="Filnera Team" />
    <meta name="theme-color" content="#FF6B35" />
    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Finlera" />
    <meta name="application-name" content="Filnera" />
    <meta name="msapplication-TileColor" content="#FF6B35" />
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="40x40" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="30x30" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Poppins + Noto Sans (for special characters) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Filnera Shop | PREMIUM Shopping</title>
    <!-- Inline CSS for Professional E-Commerce Splash Screen -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --purple-1: #6d28d9;
        --purple-2: #5b20d6;
        --purple-3: #351080;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Poppins", "Noto Sans", sans-serif;
        background: #5b20d6;
        overflow: hidden;
      }

      /* Main Splash Container */
      #flutter-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(255, 255, 255, 0.1),
            transparent 30%
          ),
          linear-gradient(
            145deg,
            var(--purple-1) 0%,
            var(--purple-2) 48%,
            var(--purple-3) 100%
          );
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.42s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.42s linear;
      }

      #flutter-loading::before {
        content: "";
        position: absolute;
        inset: -12%;
        z-index: -2;
        opacity: 0.11;
        background-image:
          linear-gradient(
            30deg,
            transparent 42%,
            rgba(255, 255, 255, 0.65) 43%,
            transparent 44%
          ),
          linear-gradient(
            150deg,
            transparent 42%,
            rgba(255, 255, 255, 0.55) 43%,
            transparent 44%
          );
        background-size: 74px 74px;
        transform: rotate(-4deg);
      }

      #flutter-loading.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Brand Logo Container */
      .brand-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
        animation: fadeInUp 0.8s ease-out;
      }

      .brand-logo {
        width: 170px;
        height: 170px;
        background: transparent;
        border: none;
        border-radius: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: none;
        margin-bottom: 18px;
        animation: logoPulse 2s ease-in-out infinite;
      }

      .brand-logo img {
        width: 170px;
        height: 170px;
        object-fit: contain;
        border-radius: 0;
        mix-blend-mode: normal;
      }

      .brand-name {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      .brand-tagline {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        font-weight: 400;
        margin-top: 8px;
        letter-spacing: 0.5px;
      }

      /* Progress Bar Container */
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none;
      }

      /* Circular Loader */
      .circle-loader {
        width: 58px;
        height: 58px;
        display: block;
        transform: rotate(-90deg);
        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.18));
      }

      .circle-loader .track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 6;
      }

      .circle-loader .progress {
        fill: none;
        stroke: #ffffff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 163.36;
        stroke-dashoffset: 163.36;
        animation: circleProgress 3.8s cubic-bezier(0.16, 0.8, 0.2, 1) forwards;
      }

      @keyframes circleProgress {
        0% {
          stroke-dashoffset: 163.36;
          opacity: 0.35;
        }

        18% {
          opacity: 0.8;
        }

        50% {
          stroke-dashoffset: 96;
          opacity: 1;
        }

        78% {
          stroke-dashoffset: 38;
        }

        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      .loading-text {
        margin-top: 16px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.2px;
      }

      .loading-subtext {
        margin-top: 5px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 11px;
        font-weight: 400;
      }

      /* Feature Pills */
      .features-container {
        display: flex;
        gap: 12px;
        margin-top: 32px;
        animation: fadeIn 1s ease-out 0.6s both;
      }

      .feature-pill {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        padding: 8px 16px;
        border-radius: 20px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
      }

      .feature-pill:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.05);
        }
      }

      /* Responsive adjustments */
      @media (max-width: 480px) {
        .brand-logo {
          width: 130px;
          height: 130px;
        }

        .brand-logo img {
          width: 130px;
          height: 130px;
        }

        .brand-name {
          font-size: 28px;
        }

        .circle-loader {
          width: 46px;
          height: 46px;
        }

        .features-container {
          flex-wrap: wrap;
          justify-content: center;
          max-width: 280px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Professional E-Commerce Splash Screen -->
    <div id="flutter-loading">
      <div class="brand-container">
        <div class="brand-logo">
          <img
            src="icons/Icon-192-splash.png"
            alt="Filnera Logo"
            onerror="
              this.src =
                'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🛍️%3C/text%3E%3C/svg%3E'
            "
          />
        </div>
        <div class="brand-name">Filnera Shop</div>
        <div class="brand-tagline">Buy Everything!</div>
      </div>

      <div class="loader-content">
        <svg
          class="circle-loader"
          viewBox="0 0 64 64"
          role="img"
          aria-label="Loading"
        >
          <circle class="track" cx="32" cy="32" r="26" />
          <circle class="progress" cx="32" cy="32" r="26" />
        </svg>

        <div class="features-container">
          <div class="feature-pill">⚡ Fast Delivery</div>
          <div class="feature-pill">🔒 Secure Payment</div>
          <div class="feature-pill">💝 Best Deals</div>
        </div>
      </div>
    </div>

    <!-- Flutter Bootstrap Script (Production Ready) -->
    <script src="flutter_bootstrap.js" async></script>

    <!-- Safe Loader Removal Script -->
    <script>
      (function () {
        "use strict";

        // Configuration
        const CONFIG = {
          loaderId: "flutter-loading",
          fallbackTimeout: 6500,
          animationDuration: 900,
          debugMode: false,
        };

        // Utility: Safe element removal
        function safeRemoveElement(elementId) {
          try {
            const element = document.getElementById(elementId);
            if (element) {
              if (element.parentNode) {
                element.parentNode.removeChild(element);
              } else {
                element.remove();
              }
              log("✓ Element removed:", elementId);
              return true;
            }
          } catch (e) {
            console.warn("[Filnera Shop] Safe remove failed:", elementId, e);
          }
          return false;
        }

        // Utility: Hide loader with smooth animation
        function hideLoader() {
          const loader = document.getElementById(CONFIG.loaderId);
          if (loader && !loader.classList.contains("hidden")) {
            loader.classList.add("hidden");
            log("✓ Loader hidden with animation");

            // Remove from DOM after animation completes
            setTimeout(function () {
              safeRemoveElement(CONFIG.loaderId);
            }, CONFIG.animationDuration);

            return true;
          }
          return false;
        }

        // Utility: Logging (only in debug mode)
        function log(message, data) {
          if (CONFIG.debugMode) {
            console.log("[Filnera Shop]", message, data || "");
          }
        }

        // Smooth percentage animation from 0 to 100 in 2 seconds
        const percentNode = document.getElementById("loading-percent");
        const progressStartedAt = performance.now();
        const progressDuration = 2000;

        function updatePercent(now) {
          try {
            const ratio = Math.min(
              (now - progressStartedAt) / progressDuration,
              1,
            );
            if (percentNode) {
              percentNode.textContent = String(Math.round(ratio * 100));
            }
            if (ratio < 1) {
              requestAnimationFrame(updatePercent);
            }
          } catch (e) {
            console.warn("[Filnera Shop] Percent update error:", e);
          }
        }

        requestAnimationFrame(updatePercent);

        // Listen for Flutter's first frame event, but keep the branded splash visible until the full loading sequence completes.
        const handleFlutterFirstFrame = function () {
          log("✓ Flutter first frame rendered");

          setTimeout(function () {
            hideLoader();
            clearTimeout(fallbackTimer);
          }, 1800);
        };

        window.addEventListener("flutter-first-frame", handleFlutterFirstFrame);

        // Fallback: Hide loader after timeout if event doesn't fire
        let fallbackTimer = setTimeout(function () {
          const loader = document.getElementById(CONFIG.loaderId);
          if (loader && !loader.classList.contains("hidden")) {
            console.warn("[Filnera] First-frame timeout, hiding loader");
            hideLoader();
          }
        }, CONFIG.fallbackTimeout);

        // Suppress non-critical WebSocket errors
        window.addEventListener("error", function (event) {
          if (
            event.message &&
            (event.message.includes("WebSocketConnectionClosed") ||
              event.message.includes("removeChild"))
          ) {
            log("⚠ Suppressed non-critical error:", event.message);
            event.preventDefault();
            return false;
          }
        });

        // Initialization logs
        log("✓ Web app initialized");
        log("⏳ Waiting for Flutter engine...");
      })();
    </script>
  </body>
</html>
